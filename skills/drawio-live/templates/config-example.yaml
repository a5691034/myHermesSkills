# =============================================================================
# drawio-live MCP server 配置示例
#
# 将本片段合并到 Hermes 的 config.yaml 的 mcp_servers: 节点下
# （或用 `hermes mcp add` 命令生成，效果相同）
#
# ⚠️ 注意：
#   - command 建议使用 Hermes 自带 node，版本 v18+
#   - env.DRAWIO_PATH 可省略：省略时 live-server 会自动检测默认安装位置，
#     检测不到需通过 DRAWIO_PATH 显式指定（见 references/setup-guide.md）
#   - connect_timeout 建议 >= 60，首次启动 draw.io 较慢
# =============================================================================

mcp_servers:
  drawio-live:
    command: C:\Users\你的用户名\.hermes-web-ui\desktop-runtime\hermes\0.20.4\win-x64\node\node.exe
    args:
      - C:\Users\你的用户名\scientific-illustrator\plugins\scientific-illustrator\scripts\live-server.mjs
    env:
      DRAWIO_PATH: D:\Program Files\draw.io\draw.io.exe
    connect_timeout: 60.0
    enabled: true

# -----------------------------------------------------------------------------
# 参数说明
# -----------------------------------------------------------------------------
# command           : node 可执行文件完整路径（必填）
# args              : live-server.mjs 的完整路径（必填，且必须是列表）
# env.DRAWIO_PATH   : draw.io 桌面版可执行文件完整路径（可选）
#                     - 不填：由 drawio-path.mjs 自动检测默认安装位置
#                     - 填了：强制使用指定路径（适用 D 盘等非默认位置）
# connect_timeout   : MCP 连接超时（秒），首次启动 draw.io 建议 >= 60
# enabled           : true 启用
#
# 默认安装位置检测顺序（Windows）：
#   %ProgramFiles%\draw.io\draw.io.exe
#   %ProgramFiles(x86)%\draw.io\draw.io.exe
#   %LOCALAPPDATA%\Programs\draw.io\draw.io.exe
#   %LOCALAPPDATA%\draw.io\draw.io.exe
# 全部不存在时，应向用户询问实际安装路径，再填入 env.DRAWIO_PATH。
# -----------------------------------------------------------------------------